name: Python SDK

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Install Python
        run: uv python install ${{ matrix.python }}
      - name: Install locked environment
        run: uv sync --python ${{ matrix.python }} --extra dev
      - name: Lint
        run: .venv/bin/python -m ruff check src tests scripts && .venv/bin/python -m ruff format --check src tests scripts
      - name: Typecheck
        run: .venv/bin/python -m mypy src
      - name: Tests
        run: .venv/bin/python -m pytest -q
      - name: Contract/model drift
        run: .venv/bin/python scripts/generate_models.py --check
      - name: Build distributions
        run: uv build --python .venv/bin/python
      - name: Scan source for secrets
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: >-
          docker run --rm --network none -v "$PWD:/source:ro"
          ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          dir /source --redact --no-banner
