[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liquidlm"
version = "0.1.0a0"
description = "Python client for the LiquidLM public API (sync + async)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic[email]>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/liquidlm/python-sdk"
Repository = "https://github.com/liquidlm/python-sdk"
Issues = "https://github.com/liquidlm/python-sdk/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "ruff>=0.6",
  "datamodel-code-generator==0.83.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/liquidlm"]

[tool.hatch.build.targets.sdist]
include = ["src/liquidlm", "contract", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["src/liquidlm/models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RET", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["httpx", "pytest"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["liquidlm.models"]
ignore_errors = true
